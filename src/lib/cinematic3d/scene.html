      new THREE.MeshPhysicalMaterial({ color: 0x20242e, roughness: 0.35, metalness: 0.6, clearcoat: 0.5 })

  const c = cut._zoomCurve; if (!c) return { scale: 1, x: 0, y: 0 };
  const f = Math.min(c.length - 1, Math.max(0, u * (c.length - 1)));
  const i = Math.floor(f), j = Math.min(c.length - 1, i + 1), a = f - i;
  return {
    scale: c[i].scale + (c[j].scale - c[i].scale) * a,
    x: c[i].x + (c[j].x - c[i].x) * a,
    y: c[i].y + (c[j].y - c[i].y) * a,
  };
}
for (const c of CUTS) if (c.zoom2d) c._zoomCurve = buildZoomCurve(c);

// --- framing solver support ----------------------------------------------
// Render an arbitrary camera/pose, then measure the resulting subject width the
// same way the reference was measured. This lets the cut list be authored in
// "subject width %" (the units the zoom map is in) instead of guessed distances.
const measCanvas = document.createElement("canvas");
measCanvas.width = 320; measCanvas.height = 180;
const measCtx = measCanvas.getContext("2d", { willReadFrequently: true });

window.measureFrame = function () {
  const MW = measCanvas.width, MH = measCanvas.height;
  measCtx.drawImage(renderer.domElement, 0, 0, MW, MH);
  const d = measCtx.getImageData(0, 0, MW, MH).data;
  const lum = new Float32Array(MW * MH);
  for (let p = 0, q = 0; p < d.length; p += 4, q++) lum[q] = 0.2126 * d[p] + 0.7152 * d[p + 1] + 0.0722 * d[p + 2];
  const TH = 18;
  const colHits = new Int32Array(MW), rowHits = new Int32Array(MH);
  let n = 0, sx = 0, sy = 0;
  for (let y = 1; y < MH - 1; y++) {
    for (let x = 1; x < MW - 1; x++) {
      const q = y * MW + x;
      if (Math.abs(lum[q + 1] - lum[q - 1]) + Math.abs(lum[q + MW] - lum[q - MW]) > TH) {
        n++; sx += x; sy += y; colHits[x]++; rowHits[y]++;
      }
    }
  }
  if (n < 120) return { w: 0, h: 0, cx: 50, cy: 50 };
  // A thin horizon line spans every column with 1-2 hits and would otherwise set
  // the bounding box to the full frame. Require real edge DENSITY per column/row.
  const maxCol = Math.max(...colHits), maxRow = Math.max(...rowHits);
  const cMin = maxCol * 0.12, rMin = maxRow * 0.12;
  let l = 0, r = MW - 1, tp = 0, bt = MH - 1;
  for (let x = 0; x < MW; x++) if (colHits[x] > cMin) { l = x; break; }
  for (let x = MW - 1; x >= 0; x--) if (colHits[x] > cMin) { r = x; break; }
  for (let y = 0; y < MH; y++) if (rowHits[y] > rMin) { tp = y; break; }
  for (let y = MH - 1; y >= 0; y--) if (rowHits[y] > rMin) { bt = y; break; }
  return {
    w: +((100 * (r - l)) / MW).toFixed(2), h: +((100 * (bt - tp)) / MH).toFixed(2),
    cx: +((100 * (sx / n)) / MW).toFixed(2), cy: +((100 * (sy / n)) / MH).toFixed(2),
  };
};

window.renderCustom = function (cfg) {
  applyEnv(cfg.env);
  const dev = cfg.device;
  showOnly(cfg.mode === "flat2d" ? "__none" : dev);
  setScreen(dev, cfg.screen);
  for (const k of ["macbook", "panel", "screen"]) if (devices[k].cursor) devices[k].cursor.visible = false;
  cursorFlat.visible = false;
  const cs = CONTACT[dev] || CONTACT.panel;
  contact.visible = cfg.mode !== "flat2d";
  contact.scale.set(cs.sx, cs.sz, 1);
  contact.position.set(cfg.pose?.px || 0, 0.06, cs.z);
  contact.material.opacity = (cfg.env === "dark" || cfg.env === "navy") ? cs.op * 0.35 : cs.op;
  floor.visible = cfg.mode !== "flat2d";
  const p = camPos(cfg.cam);
  camera.position.set(p[0], p[1], p[2]);
  camera.fov = cfg.cam.fov ?? 26; camera.updateProjectionMatrix();
  camera.lookAt(cfg.cam.target[0], cfg.cam.target[1], cfg.cam.target[2]);
  applyPose(dev, cfg.pose || {});
  renderer.clear();
  if (cfg.mode === "flat2d") {
    const map = TEX[cfg.screen];
    flatMat.map = map; flatMat.opacity = 1; flatMat.needsUpdate = true;
    const z = cfg.flat?.zoom ?? 1.05;
    const iw = map.image.videoWidth || map.image.width;
    const ih = map.image.videoHeight || map.image.height;
    const srcAR = iw / ih, dstAR = W / H;
    const cover = srcAR > dstAR ? [z * (srcAR / dstAR), z] : [z, z * (dstAR / srcAR)];
    flatQuad.scale.set(cover[0], cover[1], 1);
    flatQuad.position.set(cfg.flat?.x ?? 0, cfg.flat?.y ?? 0, -1);
    fadeMat.opacity = 0;
    renderer.render(overlay, ortho);
  } else {
    renderer.render(scene, camera);
  }
};

window.CUT_TABLE = CUTS.map((c) => ({ name: c.name, start: c.tStart, dur: c.dur, env: c.env, device: c.device }));
Object.assign(window, { __scene: scene, __camera: camera, __devices: devices, THREE });
window.renderAtTime(0);
window.__ready = true;
</script>
