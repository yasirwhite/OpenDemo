<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 124" width="470" height="124" role="img" aria-label="OpenDemo">
  <title>OpenDemo</title>
  <!--
    OpenDemo logo — "the lit portal".

    THE MARK is a rounded-square portal — the frame you watch a demo inside,
    and the shape the OpenDemo gallery already uses — broken once at the crown,
    with a bead of light nested in the break. The break is the "open". The bead
    is the star: in the closing film (preset `star-lockup`) this whole mark is
    born out of that single point of light, the two strokes growing outward
    from the break and colliding at the floor. The stroke runs warm at the
    crown and cools to violet at the feet — the white light refracting into the
    brand's two colours as it becomes the mark. #e8483a -> #7c6cf5 is the
    existing gallery gradient, so the mark inherits brand equity rather than
    inventing a palette.

    Geometry lives in a 100x100 unit box and is DUPLICATED, path string for
    path string, in src/presets/star-lockup.jsx (const MARK) so the animation
    can draw it stroke-by-stroke with no binary asset. Change one, change the
    other. Visible ink is 83 x 83.5 units; it reads down to ~20px.

    This is the LIGHT-GROUND primary. For dark grounds set the wordmark fill to
    #f0eef6; the mark itself needs no change. <g id="mark"> is the standalone
    mark.
  -->
  <defs>
    <linearGradient id="od-arch" gradientUnits="userSpaceOnUse" x1="50" y1="10" x2="50" y2="90">
      <stop offset="0"    stop-color="#f29790"/>
      <stop offset="0.34" stop-color="#e8483a"/>
      <stop offset="1"    stop-color="#7c6cf5"/>
    </linearGradient>
    <radialGradient id="od-bead-glow">
      <stop offset="0"    stop-color="#ff9b83" stop-opacity="0.38"/>
      <stop offset="0.5"  stop-color="#ff9b83" stop-opacity="0.13"/>
      <stop offset="1"    stop-color="#ff9b83" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g id="mark" transform="translate(7.5 12)">
    <!-- residual glow: the light never entirely leaves the mark -->
    <circle cx="50" cy="15" r="26" fill="url(#od-bead-glow)"/>
    <!-- the portal. Both strokes START at the crown break and meet at the
         floor's midpoint — the direction the animation ignites in. -->
    <g fill="none" stroke="url(#od-arch)" stroke-width="13" stroke-linecap="round">
      <path d="M35 15H31A16 16 0 0 0 15 31V69A16 16 0 0 0 31 85H50"/>
      <path d="M65 15H69A16 16 0 0 1 85 31V69A16 16 0 0 1 69 85H50"/>
    </g>
    <!-- the bead of light in the break -->
    <circle cx="50" cy="15" r="7" fill="#ffffff" stroke="#f0705f" stroke-width="2"/>
  </g>

  <!-- wordmark: light "Open", bold "Demo" — the same two-part read as the
       two-colour portal. House geometric grotesque, cap-centred on the mark. -->
  <text x="124" y="87" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif"
        font-size="72" letter-spacing="-1.15" fill="#14121f">
    <tspan font-weight="300">Open</tspan><tspan font-weight="640">Demo</tspan>
  </text>
</svg>
