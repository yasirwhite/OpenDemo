<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kite 3D WebGL MacBook Pro Renderer</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0a0b12;
      overflow: hidden;
    }
    #canvas-container {
      width: 1280px;
      height: 720px;
      position: relative;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
  <script src="/three.min.js"></script>
  <script src="/DRACOLoader.js"></script>
  <script src="/GLTFLoader.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <script>
    let scene, camera, renderer, laptopGroup;
    let videoTexture, appCanvas, appCtx;
    let clock = new THREE.Clock();
    window.modelLoaded = false;

    // Get background wallpaper choice from URL param ?bg=3 (default to 3)
    const urlParams = new URLSearchParams(window.location.search);
    const bgNum = urlParams.get('bg') || '3';
    const bgPath = `/wallpapers/wallpaper${bgNum}.jpg`;

    function init() {
      const container = document.getElementById('canvas-container');

      // 1. Scene
      scene = new THREE.Scene();

      // 2. Camera
      camera = new THREE.PerspectiveCamera(36, 1280 / 720, 0.1, 200);
      camera.position.set(0, 2.2, 10.5);

      // 3. Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setSize(1280, 720);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.physicallyCorrectLights = true;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;
      container.appendChild(renderer.domElement);

      // 4. OpenScreen 2D Wallpaper Background
      const textureLoader = new THREE.TextureLoader();
      textureLoader.load(bgPath, (bgTexture) => {
        bgTexture.encoding = THREE.sRGBEncoding;
        const bgGeo = new THREE.PlaneGeometry(75, 42);
        const bgMat = new THREE.MeshBasicMaterial({ map: bgTexture, fog: false });
        const bgMesh = new THREE.Mesh(bgGeo, bgMat);
        bgMesh.position.z = -22;
        scene.add(bgMesh);
      });

      // 5. Studio Product Lighting
      scene.add(new THREE.AmbientLight(0xffffff, 1.2));

      // Key light from top right
      const keyLight = new THREE.DirectionalLight(0xfff8f0, 3.5);
      keyLight.position.set(6, 15, 12);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.width = 2048;
      keyLight.shadow.mapSize.height = 2048;
      keyLight.shadow.camera.near = 1;
      keyLight.shadow.camera.far = 50;
      keyLight.shadow.camera.top = 15;
      keyLight.shadow.camera.bottom = -10;
      keyLight.shadow.camera.left = -15;
      keyLight.shadow.camera.right = 15;
      scene.add(keyLight);

      // Rim light for metallic chamfer edges
      const rimLight = new THREE.PointLight(0xa5b4fc, 4.5, 30);
      rimLight.position.set(-9, 5, -4);
      scene.add(rimLight);

      // Front fill light
      const fillLight = new THREE.PointLight(0xffffff, 1.8, 18);
      fillLight.position.set(0, 4, 8);
      scene.add(fillLight);

      // 6. App canvas texture
      appCanvas = document.createElement('canvas');
      appCanvas.width = 1920;
      appCanvas.height = 1080;
      appCtx = appCanvas.getContext('2d');
      drawWebsiteUI(appCtx, 0);

      videoTexture = new THREE.CanvasTexture(appCanvas);
      videoTexture.minFilter = THREE.LinearFilter;
      videoTexture.magFilter = THREE.LinearFilter;
      videoTexture.generateMipmaps = false;
      videoTexture.encoding = THREE.sRGBEncoding;

      // 7. Load Genuine MacBook Pro 3D Mesh (.glb) with DRACOLoader
      laptopGroup = new THREE.Group();
      scene.add(laptopGroup);

      const dracoLoader = new THREE.DRACOLoader();
      dracoLoader.setDecoderPath('/draco/');

      const loader = new THREE.GLTFLoader();
      loader.setDRACOLoader(dracoLoader);

      loader.load('/mac.glb', (gltf) => {
        const macModel = gltf.scene;

        macModel.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;

            // Target screen mesh ('matte')
            if (child.name === 'matte' || (child.material && child.material.name === 'matte')) {
              const screenMat = new THREE.MeshBasicMaterial({
                map: videoTexture
              });
              child.material = screenMat;
            } else if (child.material) {
              child.material.envMapIntensity = 1.8;
            }
          }
        });

        // Scale mac.glb (31.5 units wide natively -> scale by 0.27 to ~8.5 units wide)
        macModel.scale.set(0.27, 0.27, 0.27);
        macModel.position.set(0, -1.2, 0);
        laptopGroup.add(macModel);
        window.modelLoaded = true;
      }, undefined, (err) => {
        console.error('Error loading mac.glb model:', err);
      });

      // 8. Ground shadow plane
      const shadowPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(40, 40),
        new THREE.ShadowMaterial({ opacity: 0.35 })
      );
      shadowPlane.rotation.x = -Math.PI / 2;
      shadowPlane.position.y = -1.4;
      shadowPlane.receiveShadow = true;
      scene.add(shadowPlane);

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      drawWebsiteUI(appCtx, t);
      videoTexture.needsUpdate = true;

      // Camera choreography (smooth lerp, natural angles)
      let cx = 0, cy = 2.2, cz = 10.5;
      let ry = -0.30, rx = 0.18;

      if (t >= 4 && t < 9) {
        cx = 0.3; cy = 1.4; cz = 7.8;
        ry = -0.28; rx = 0.14;
      } else if (t >= 9) {
        cx = -0.5; cy = 2.0; cz = 10.0;
        ry = 0.20; rx = 0.14;
      }

      const s = 0.04;
      camera.position.x += (cx - camera.position.x) * s;
      camera.position.y += (cy - camera.position.y) * s;
      camera.position.z += (cz - camera.position.z) * s;
      camera.lookAt(0, 0.8, 0);

      if (laptopGroup) {
        laptopGroup.rotation.y += (ry - laptopGroup.rotation.y) * s;
        laptopGroup.rotation.x += (rx - laptopGroup.rotation.x) * s;
      }

      renderer.render(scene, camera);
    }

    function drawWebsiteUI(ctx, t) {
      const W = 1920, H = 1080;

      // ── Background ──────────────────────────────────────────────────────────
      ctx.fillStyle = '#0f1117';
      ctx.fillRect(0, 0, W, H);

      // Subtle radial glow in bg
      const bgGlow = ctx.createRadialGradient(960, 300, 0, 960, 300, 900);
      bgGlow.addColorStop(0, 'rgba(99, 102, 241, 0.06)');
      bgGlow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = bgGlow;
      ctx.fillRect(0, 0, W, H);

      // ── macOS window chrome ──────────────────────────────────────────────────
      ctx.fillStyle = '#16182a';
      ctx.fillRect(0, 0, W, 52);
      // traffic lights
      const tlc = ['#ff5f56', '#ffbd2e', '#27c93f'];
      tlc.forEach((c, i) => {
        ctx.fillStyle = c;
        ctx.beginPath(); ctx.arc(24 + i * 24, 26, 7, 0, Math.PI * 2); ctx.fill();
      });
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 19px system-ui, sans-serif';
      ctx.fillText('Kite Studio  —  Product Analytics', 100, 33);
      ctx.fillStyle = '#555e7a';
      ctx.font = '15px system-ui';
      ctx.fillText('Dashboard   Analytics   3D Renders   Settings', 1480, 33);

      // ── Hero header ─────────────────────────────────────────────────────────
      ctx.fillStyle = '#e2e8f0';
      ctx.font = 'bold 52px system-ui, sans-serif';
      ctx.fillText('Product Analytics Dashboard', 72, 148);

      ctx.fillStyle = '#64748b';
      ctx.font = '22px system-ui';
      ctx.fillText('Real-time metrics with smooth 3D visualization powered by WebGL', 72, 190);

      // CTA pill button
      const btnX = 1530, btnY = 120, btnW = 310, btnH = 58;
      const btnGr = ctx.createLinearGradient(btnX, 0, btnX + btnW, 0);
      btnGr.addColorStop(0, '#6366f1');
      btnGr.addColorStop(1, '#a855f7');
      ctx.fillStyle = btnGr;
      roundRect(ctx, btnX, btnY, btnW, btnH, 14);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 18px system-ui';
      ctx.fillText('↗  Export 3D Video', btnX + 58, btnY + 36);

      // ── Stat cards ──────────────────────────────────────────────────────────
      const stats = [
        { label: 'ACTIVE USERS',    val: '28,941',    delta: '+12.4%',  color: '#818cf8' },
        { label: 'REVENUE TODAY',   val: '$84,302',   delta: '+8.7%',   color: '#34d399' },
        { label: 'CONVERSION RATE', val: '4.82%',     delta: '+1.2%',   color: '#f59e0b' },
        { label: 'AVG SESSION',     val: '3m 41s',    delta: '+5.3%',   color: '#38bdf8' },
      ];
      stats.forEach((s, i) => {
        const cx = 72 + i * 455, cy = 226;
        ctx.fillStyle = '#16192a';
        ctx.strokeStyle = 'rgba(255,255,255,0.07)';
        ctx.lineWidth = 1;
        roundRect(ctx, cx, cy, 425, 168, 16); ctx.fill(); ctx.stroke();

        ctx.fillStyle = s.color;
        ctx.fillRect(cx + 0, cy, 4, 168);
        ctx.beginPath(); ctx.arc(cx + 2, cy + 2, 2, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = '#475569';
        ctx.font = '600 13px system-ui';
        ctx.fillText(s.label, cx + 22, cy + 36);

        ctx.fillStyle = '#f1f5f9';
        ctx.font = 'bold 46px system-ui';
        ctx.fillText(s.val, cx + 22, cy + 112);

        ctx.fillStyle = '#22c55e';
        ctx.font = '600 14px system-ui';
        ctx.fillText('▲ ' + s.delta + ' vs yesterday', cx + 22, cy + 148);
      });

      // ── Chart area ──────────────────────────────────────────────────────────
      const chartX = 72, chartY = 420, chartW = 1776, chartH = 590;
      ctx.fillStyle = '#13162a';
      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      ctx.lineWidth = 1;
      roundRect(ctx, chartX, chartY, chartW, chartH, 20); ctx.fill(); ctx.stroke();

      ctx.fillStyle = '#e2e8f0';
      ctx.font = 'bold 26px system-ui';
      ctx.fillText('Weekly Revenue Trend', chartX + 36, chartY + 52);

      // Chart grid lines
      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      ctx.lineWidth = 1;
      for (let g = 1; g <= 4; g++) {
        const gy = chartY + 80 + (chartH - 110) * (g / 5);
        ctx.beginPath(); ctx.moveTo(chartX + 20, gy); ctx.lineTo(chartX + chartW - 20, gy); ctx.stroke();
      }

      // Bars (animated)
      const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
      const barAreaH = chartH - 130;
      const barW = 140, barGap = (chartW - 80 - days.length * barW) / (days.length + 1);
      days.forEach((day, i) => {
        const barX = chartX + 40 + barGap * (i + 1) + barW * i;
        const hf = 0.32 + 0.46 * Math.abs(Math.sin(t * 1.8 + i * 0.75));
        const barH2 = barAreaH * hf;
        const barY = chartY + 80 + (barAreaH - barH2);

        const gr = ctx.createLinearGradient(barX, barY, barX, barY + barH2);
        gr.addColorStop(0, '#818cf8');
        gr.addColorStop(0.5, '#6366f1');
        gr.addColorStop(1, '#4f46e5');
        ctx.fillStyle = gr;
        roundRect(ctx, barX, barY, barW, barH2, [10, 10, 0, 0]); ctx.fill();

        // Glow under bar
        const glow = ctx.createLinearGradient(barX, barY + barH2 - 20, barX, barY + barH2 + 40);
        glow.addColorStop(0, 'rgba(99,102,241,0.35)');
        glow.addColorStop(1, 'rgba(99,102,241,0)');
        ctx.fillStyle = glow;
        ctx.fillRect(barX - 10, barY + barH2 - 10, barW + 20, 50);

        // Value label on bar
        const val = Math.round(24000 * hf + 8000);
        ctx.fillStyle = '#f1f5f9';
        ctx.font = 'bold 18px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('$' + (val / 1000).toFixed(1) + 'k', barX + barW / 2, barY - 12);

        ctx.fillStyle = '#64748b';
        ctx.font = '17px system-ui';
        ctx.fillText(day, barX + barW / 2, chartY + chartH - 18);
        ctx.textAlign = 'left';
      });

      // ── Animated cursor ──────────────────────────────────────────────────────
      const mx = 960 + Math.sin(t * 1.3) * 480;
      const my = 620 + Math.cos(t * 1.0) * 220;
      drawCursor(ctx, mx, my);
    }

    function drawCursor(ctx, x, y) {
      ctx.save();
      ctx.strokeStyle = '#ffffff';
      ctx.fillStyle = '#6366f1';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + 24, y + 26);
      ctx.lineTo(x + 12, y + 27);
      ctx.lineTo(x + 18, y + 42);
      ctx.lineTo(x + 11, y + 44);
      ctx.lineTo(x + 5, y + 29);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function roundRect(ctx, x, y, w, h, r) {
      const rArr = Array.isArray(r) ? r : [r, r, r, r];
      const [tl, tr, br, bl] = rArr;
      ctx.beginPath();
      ctx.moveTo(x + tl, y);
      ctx.lineTo(x + w - tr, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + tr);
      ctx.lineTo(x + w, y + h - br);
      ctx.quadraticCurveTo(x + w, y + h, x + w - br, y + h);
      ctx.lineTo(x + bl, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - bl);
      ctx.lineTo(x, y + tl);
      ctx.quadraticCurveTo(x, y, x + tl, y);
      ctx.closePath();
    }

    window.onload = init;
  </script>
</body>
</html>
